name: Core on every platform

# The TemenCAD core (lamassu-js + Manifold + the API) built and tested on each target it ships for:
#   native Linux and macOS (CMake, the temencore CLI over every test script and the demo)
#   WebAssembly (Emscripten; the smoke test and the old-runner-vs-core differential test)
#   Apple (TemenCore.xcframework for macOS, iOS and the simulator; the Swift package tests; the iOS app builds)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure and build
        run: |
          cmake -S core -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j4
      - name: Version
        run: build/native/temencore --version
      - name: Every test script and the demo through the CLI
        run: core/test/run-native.sh

  windows:
    name: native (windows, MSYS2 gcc)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja git
      - name: Configure and build
        run: |
          cmake -S core -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j4
      - name: Version
        run: build/native/temencore.exe --version
      - name: Every test script and the demo through the CLI
        run: core/test/run-native.sh build/native/temencore.exe

  wasm:
    name: wasm (Emscripten) + parity with the JavaScript runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - run: npm ci
      - name: Build the WebAssembly module
        run: npm run core:wasm
      - name: Smoke test (exact volumes)
        run: npm run core:test
      - name: Differential test (old runner vs core on every script)
        run: npm run core:diff
      - name: The command line on the core
        run: npm test
      - name: STL and 3MF from the native core match the web app's, byte for byte
        run: |
          cmake -S core -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j4 --target temencore-cli
          npm run core:export -- build/native/temencore
      - name: The site
        run: npm run build

  apple:
    name: XCFramework + Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version
      - name: Build TemenCore.xcframework (macOS, iOS, simulator)
        run: core/swift/build-xcframework.sh
      - name: Slices
        run: |
          ls core/swift/TemenCore.xcframework
          lipo -info core/swift/TemenCore.xcframework/*/libTemenCAD.a
      - name: Swift tests
        working-directory: core/swift
        run: swift test
      - name: iOS app (simulator and device, unsigned)
        working-directory: ios
        run: |
          xcodebuild -project TemenCAD.xcodeproj -scheme TemenCADApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet
          xcodebuild -project TemenCAD.xcodeproj -scheme TemenCADApp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: TemenCore.xcframework
          path: core/swift/TemenCore.xcframework
          if-no-files-found: error
